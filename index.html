<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/mathematic.ico" type="image/x-icon">

    <title>Math Operations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #5a5a5a;
        }

        .buttons {
            margin-top: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button {
            padding: 20px 40px;
            margin: 10px;
            border: none;
            background-color: #007BFF;
            color: white;
            font-size: 24px;
            cursor: pointer;
            border-radius: 10px;
            transition: background-color 0.3s;
            text-decoration: none;
        }

        .button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 600px) {
            .button {
                font-size: 18px;
                padding: 15px 30px;
            }
        }
        /* ==========================
   DARK MODE
========================== */

.theme-btn{
    position:fixed;
    top:15px;
    right:15px;
    z-index:9999;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#222;
    color:#fff;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

.theme-btn:hover{
    transform:scale(1.05);
}

/* Animate everything */
body,
table,
button,
nav,
th,
td,
h1,
h2,
select,
label,
a{
    transition:0.3s ease;
}

/* BODY */
body.dark{
    background:#121212;
    color:#eee;
}

/* Headings */
body.dark h1,
body.dark h2,
body.dark label{
    color:#fff;
}

/* Navigation */
body.dark nav{
    background:#1f1f1f;
}

/* Tables */
body.dark table{
    background:#1e1e1e;
    color:#fff;
    box-shadow:0 0 20px rgba(255,255,255,.05);
}

body.dark th{
    background:#2d6cdf;
}

body.dark td{
    border-color:#444;
}

/* Alternate rows */
body.dark tr:nth-child(even){
    background:#222;
}

/* Hover */
body.dark tr:hover{
    background:#333;
}

/* Buttons */
body.dark button{
    background:#2d6cdf;
    color:white;
}

body.dark button:hover{
    background:#4d84e6;
}

/* Select */
body.dark select{
    background:#222;
    color:white;
    border:1px solid #555;
}

/* Total cells */
body.dark .totalCell{
    background:#2a2a2a;
}

/* Theme button */
body.dark .theme-btn{
    background:#FFD54F;
    color:#111;
}
    </style>
</head>
<body>
    <h1>Welcome to Math Operations</h1>
    <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    <div class="buttons">
    <a href="Addition.html" class="button">Addition</a>
    <a href="Subtraction.html" class="button">Subtraction</a>
    <a href="Multiplication.html" class="button">Multiplication</a>
    </div>
    <script>

// Load saved theme
if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
    document.getElementById("themeToggle").innerHTML="☀️ Light Mode";
}

// Toggle theme
document.getElementById("themeToggle").onclick=function(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        localStorage.setItem("theme","dark");
        this.innerHTML="☀️ Light Mode";
    }else{
        localStorage.setItem("theme","light");
        this.innerHTML="🌙 Dark Mode";
    }

};

</script>
</body>
</html>
