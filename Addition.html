<!DOCTYPE html>
<html>
<head>
    <title>Addition</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
            width: 100%;
        }
        nav {
            background-color: #007BFF;
            padding: 10px;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            gap: 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        nav ul li a.disabled {
            color: #ccc;
            pointer-events: none;
            cursor: default;
        }
        nav ul li a:hover {
            text-decoration: underline;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            align-items: center;
            margin: 0 20px;
        }
        table {
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 18px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            width: 60px;
            height: 60px;
        }
        th {
            background-color: #f2f2f2;
        }
        .totalCell {
            background-color: #fffae6;
            font-weight: bold;
        }
        button, select {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover, select:hover {
            background-color: #0056b3;
        }
        select {
            padding: 5px 10px;
        }
        label {
            font-size: 18px;
            margin-right: 10px;
            color: #333;
        }
        .bottom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        /* ==========================
   DARK MODE
========================== */

.theme-btn{
    position:fixed;
    top:15px;
    right:15px;
    z-index:9999;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#222;
    color:#fff;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

.theme-btn:hover{
    transform:scale(1.05);
}

/* Animate everything */
body,
table,
button,
nav,
th,
td,
h1,
h2,
select,
label,
a{
    transition:0.3s ease;
}

/* BODY */
body.dark{
    background:#121212;
    color:#eee;
}

/* Headings */
body.dark h1,
body.dark h2,
body.dark label{
    color:#fff;
}

/* Navigation */
body.dark nav{
    background:#1f1f1f;
}

/* Tables */
body.dark table{
    background:#1e1e1e;
    color:#fff;
    box-shadow:0 0 20px rgba(255,255,255,.05);
}

body.dark th{
    background:#2d6cdf;
}

body.dark td{
    border-color:#444;
}

/* Alternate rows */
body.dark tr:nth-child(even){
    background:#222;
}

/* Hover */
body.dark tr:hover{
    background:#333;
}

/* Buttons */
body.dark button{
    background:#2d6cdf;
    color:white;
}

body.dark button:hover{
    background:#4d84e6;
}

/* Select */
body.dark select{
    background:#222;
    color:white;
    border:1px solid #555;
}

/* Total cells */
body.dark .totalCell{
    background:#2a2a2a;
}

/* Theme button */
body.dark .theme-btn{
    background:#FFD54F;
    color:#111;
}
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#" class="disabled">Addition</a></li>
            <li><a href="Subtraction.html">Subtraction</a></li>
            <li><a href="Multiplication.html">Multiplication</a></li>
        </ul>
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </nav>
    
    <h1>Addition</h1>
    <div class="controls">
        <div class="control-group">
            <label for="sizeSelect">Select Grid Size:</label>
            <select id="sizeSelect" onchange="generateNumbers()">
                <option value="6">6x6</option>
                <option value="7">7x7</option>
                <option value="8">8x8</option>
                <option value="9">9x9</option>
                <option value="10">10x10</option>
                <option value="11">11x11</option>
            </select>
        </div>
        <button onclick="generateNumbers()">Generate Numbers</button>
    </div>
    <table id="numberTable">
        <!-- Table will be generated by JavaScript -->
    </table>
    <div class="bottom-controls">
        <button onclick="toggleTotal()">Show/Hide Total</button>
    </div>
    <script>
        function randomTwoDigitNumber() {
            return Math.floor(Math.random() * 90) + 10;
        }

        function generateNumbers() {
            const size = parseInt(document.getElementById("sizeSelect").value);
            const table = document.getElementById("numberTable");
            table.innerHTML = "";
            let total = 0;

            for (let i = 0; i < size; i++) {
                let row = table.insertRow();
                for (let j = 0; j < size; j++) {
                    let cell = row.insertCell();
                    if (i < size - 1 && j < size - 1) {
                        let num = randomTwoDigitNumber();
                        cell.innerHTML = num;
                        total += num;
                    } else if (i < size - 1) {
                        cell.innerHTML = calculateSum(i, j, size);
                        cell.classList.add('totalCell');
                    } else if (j < size - 1) {
                        cell.innerHTML = calculateSum(i, j, size);
                        cell.classList.add('totalCell');
                    } else {
                        cell.innerHTML = total;
                        cell.classList.add('totalCell');
                    }
                }
            }
            toggleTotal(); // Ensure totals are hidden initially
        }

        function calculateSum(i, j, size) {
            let sum = 0;
            const table = document.getElementById("numberTable");
            if (j === size - 1) {
                for (let k = 0; k < size - 1; k++) {
                    sum += parseInt(table.rows[i].cells[k].innerHTML || 0);
                }
            } else if (i === size - 1) {
                for (let k = 0; k < size - 1; k++) {
                    sum += parseInt(table.rows[k].cells[j].innerHTML || 0);
                }
            }
            return sum;
        }

        function toggleTotal() {
            const totalCells = document.querySelectorAll('.totalCell');
            totalCells.forEach(cell => {
                cell.style.display = cell.style.display === "none" ? "table-cell" : "none";
            });
        }

        generateNumbers(); // Generate initial numbers
    </script>
    <script>

// Load saved theme
if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
    document.getElementById("themeToggle").innerHTML="☀️ Light Mode";
}

// Toggle theme
document.getElementById("themeToggle").onclick=function(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        localStorage.setItem("theme","dark");
        this.innerHTML="☀️ Light Mode";
    }else{
        localStorage.setItem("theme","light");
        this.innerHTML="🌙 Dark Mode";
    }

};

</script>
</body>
</html>
