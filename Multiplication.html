<h2>2–3 Digit Multiplication Practice</h2>

<table>

<thead>

<tr>
<th>Problem</th>
<th>Answer</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<button onclick="generateProblems()">
Generate New Problems
</button>

<button onclick="toggleAnswers()">
Show / Hide Answers
</button>

<script>

function randomDigit(){

    //50% chance of 2-digit or 3-digit

    if(Math.random()<0.5)
        return Math.floor(Math.random()*90)+10;

    return Math.floor(Math.random()*900)+100;

}

function generateProblems(){

    const tbody=document.getElementById("tableBody");

    tbody.innerHTML="";

    for(let i=0;i<5;i++){

        let a=randomDigit();
        let b=randomDigit();

        let row=document.createElement("tr");

        let q=document.createElement("td");
        q.className="question";

        q.textContent=
`${a}
× ${b}`;

        let ans=document.createElement("td");
        ans.className="answer";
        ans.textContent=a*b;
        ans.style.display="none";

        row.appendChild(q);
        row.appendChild(ans);

        tbody.appendChild(row);

    }

}

function toggleAnswers(){

    const answers=document.querySelectorAll(".answer");

    answers.forEach(a=>{

        if(a.style.display==="none")
            a.style.display="table-cell";
        else
            a.style.display="none";

    });

}

generateProblems();

</script>
    <script>

// Load saved theme
if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
    document.getElementById("themeToggle").innerHTML="☀️ Light Mode";
}

// Toggle theme
document.getElementById("themeToggle").onclick=function(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        localStorage.setItem("theme","dark");
        this.innerHTML="☀️ Light Mode";
    }else{
        localStorage.setItem("theme","light");
        this.innerHTML="🌙 Dark Mode";
    }

};
